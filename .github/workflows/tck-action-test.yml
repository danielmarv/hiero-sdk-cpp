# Exercises hiero-hackers/hiero-tck-action against the C++ SDK's JSON-RPC server.
# This workflow exists only on the tck-action-test branch of this fork.
name: TCK Action Test

on:
  push:
    branches: [tck-action-test]
  workflow_dispatch:
    inputs:
      testMatrix:
        description: "Mocha args for the TCK run. Empty runs the whole suite."
        required: false
        default: "src/tests/crypto-service/test-account-create-transaction.ts"

permissions:
  contents: read

jobs:
  tck:
    name: TCK
    runs-on: ubuntu-latest
    # The C++ server is compiled from source, which dominates the run.
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Submodules are left alone: the Dockerfile fetches vcpkg itself, at the
        # commit named by vcpkg.json's own baseline.

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@6a79c9451fc1b26a98536facc3b988ab122ffbc8 # v0.24.0
        with:
          installMirrorNode: true

      # No pre-build step this time. The action now builds before it checks out
      # the TCK, so it gets a clean context and there is nothing to warm.
      - name: Run TCK
        id: tck
        uses: hiero-hackers/hiero-tck-action@fix/build-context-and-cache
        with:
          dockerfilePath: ./src/tck/Dockerfile
          dockerBuildArgs: "--build-arg BUILD_JOBS=4"
          serverEnv: |
            TCK_PORT=8544
          testMatrix: ${{ inputs.testMatrix == null && 'src/tests/crypto-service/test-account-create-transaction.ts' || inputs.testMatrix }}
          artifactName: tck-report-cpp

      - name: Summarise
        if: always()
        run: |
          echo "passed=${{ steps.tck.outputs.passed }} failed=${{ steps.tck.outputs.failed }} of ${{ steps.tck.outputs.total }}"
          echo "genuine=${{ steps.tck.outputs.genuineFailures }} infra=${{ steps.tck.outputs.infraFailures }}"
